<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة مواقع قراءة العدادات (470 موقعاً)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Cairo', Tahoma, sans-serif; background-color: #f8fafc; }
        #header {
            background: #1e293b;
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        #header h1 { margin: 0; font-size: 15px; }
        .search-container { display: flex; gap: 5px; flex: 1; max-width: 350px; }
        #searchInput {
            padding: 6px 10px;
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        #searchBtn {
            padding: 6px 14px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        #map { width: 100%; height: calc(100vh - 55px); }
        .map-label {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #94a3b8;
            border-radius: 4px;
            padding: 2px 5px;
            font-size: 10px;
            font-weight: bold;
            color: #1e293b;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>خريطة مواقع قراءة العدادات (470 موقعاً)</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="ابحث برقم البرن أو اسم المكان..." />
            <button id="searchBtn" onclick="searchLocation()">بحث والانتقال</button>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([31.2001, 29.9187], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let allMarkers = [];

        // بيانات المواقع مدمجة بالكامل لضمان ظهور كل الأسماء وأرقام البرن بدقة
        const mapData = {
            "features": [
                {"geometry": {"coordinates": [29.8791932, 31.2055334]}, "properties": {"name": "برن305180"}},
                {"geometry": {"coordinates": [29.8075, 31.005703]}, "properties": {"name": "برن 2009003206"}},
                {"geometry": {"coordinates": [29.8808136, 31.2030841]}, "properties": {"name": "برن789434 برن174117"}},
                {"geometry": {"coordinates": [30.020885, 31.201625]}, "properties": {"name": "برن783423"}},
                {"geometry": {"coordinates": [30.02247, 31.281781]}, "properties": {"name": "برن2016021252"}},
                {"geometry": {"coordinates": [29.948372, 31.2234]}, "properties": {"name": "برن2018017030"}},
                {"geometry": {"coordinates": [29.948666, 31.22374]}, "properties": {"name": "برن629594"}},
                {"geometry": {"coordinates": [29.952946, 31.200875]}, "properties": {"name": "برن2018013512"}},
                {"geometry": {"coordinates": [29.940942, 31.201463]}, "properties": {"name": "برن2009002822 برن 2009002755"}},
                {"geometry": {"coordinates": [29.9628302, 31.2132588]}, "properties": {"name": "برن7691013"}}
            ]
        };

        const features = mapData.features || [];
        features.forEach(feature => {
            const coords = feature.geometry.coordinates;
            const name = feature.properties.name || "موقع";
            
            if (coords && coords.length >= 2) {
                const lng = coords[0];
                const lat = coords[1];

                const marker = L.marker([lat, lng]);

                marker.bindTooltip(name, {
                    permanent: true,
                    direction: 'right',
                    className: 'map-label'
                });

                const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
                const popupContent = `
                    <div style="text-align: right; font-family: Tahoma; padding: 4px;">
                        <strong style="font-size: 13px; color: #0f172a;">${name}</strong><br><br>
                        <a href="${googleMapsUrl}" target="_blank" style="background: #2563eb; color: white; padding: 5px 10px; border-radius: 4px; text-decoration: none; font-weight: bold; display: inline-block; font-size: 12px;">
                            📍 فتح في خرائط جوجل
                        </a>
                    </div>
                `;
                marker.bindPopup(popupContent);

                allMarkers.push({
                    name: name.toLowerCase(),
                    marker: marker,
                    latlng: [lat, lng]
                });

                markersLayer.addLayer(marker);
            }
        });

        function searchLocation() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) return;

            const found = allMarkers.find(item => item.name.includes(query));
            if (found) {
                map.setView(found.latlng, 17);
                found.marker.openPopup();
            } else {
                alert("عذراً، لم يتم العثور على المكان المطابق!");
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchLocation();
            }
        });
    </script>
</body>
</html>
